plugins {
    id 'java'
    id 'application'
}

group 'webapp-hardware-bridge'
version '1.0.2'

sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    // The production code uses the SLF4J logging API at compile time
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j2-impl', version: '2.23.1'

    implementation group: 'commons-io', name: 'commons-io', version: '2.16.1'
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.17.1'
    implementation group: 'org.apache.httpcomponents.core5', name: 'httpcore5', version: '5.2.5'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.17.2'
    implementation group: 'com.fazecast', name: 'jSerialComm', version: '2.11.4'
    implementation group: 'org.apache.pdfbox', name: 'pdfbox', version: '2.0.31'
    implementation group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.78.1'
    implementation group: 'org.bouncycastle', name: 'bcpkix-jdk18on', version: '1.78.1'
    implementation group: 'io.javalin', name: 'javalin', version: '6.2.0'
    implementation group: 'io.javalin.community.ssl', name: 'ssl-plugin', version: '6.2.0'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

application {
    mainClass = 'tigerworkshop.webapphardwarebridge.GUI'
}

jar {
    archiveFileName = 'webapp-hardware-bridge.jar'
    manifest {
    	attributes "Main-Class": "tigerworkshop.webapphardwarebridge.GUI"
        attributes "Class-Path": configurations.runtimeClasspath.files.collect { it.getName() }.join(' ')
    }
}

// Mirrors what the IntelliJ "webapp-hardware-bridge:jar" artifact used to produce:
// the runnable jar plus every runtime dependency jar, flat, next to each other,
// because the manifest's Class-Path expects them side by side.
def installerStagingDir = layout.projectDirectory.dir('out/artifacts/webapp_hardware_bridge_jar')

tasks.register('stageInstaller', Sync) {
    group = 'distribution'
    description = 'Stages the jar and its runtime dependencies for the NSIS installer'
    dependsOn jar
    from(jar.archiveFile)
    from(configurations.runtimeClasspath)
    into(installerStagingDir)
}

tasks.register('buildInstaller', Exec) {
    group = 'distribution'
    description = 'Builds whb.exe with NSIS (needs makensis on PATH, and ./jre + ./demo present)'
    dependsOn stageInstaller

    doFirst {
        if (!file('jre').isDirectory()) {
            throw new GradleException("./jre is missing - copy a JRE 21 there first, see BUILD.md.")
        }
    }

    workingDir(projectDir)
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    commandLine(isWindows ? 'makensis.exe' : 'makensis', 'install.nsi')
}

// AppImage packaging for Linux, mirroring the Windows NSIS installer:
// a self-contained AppDir with the jar+deps, a bundled Linux JRE, and a
// launcher script, squashed into a single portable executable.
def linuxRuntimeDir = layout.projectDirectory.dir('jre-linux')
def appDir = layout.projectDirectory.dir('out/AppDir')
def appImageToolFile = layout.projectDirectory.file('appimagetool.AppImage')

tasks.register('stageAppImage', Sync) {
    group = 'distribution'
    description = 'Stages an AppDir for AppImage packaging (needs ./jre-linux, a Linux x64 JRE 21)'
    dependsOn stageInstaller

    doFirst {
        if (!file('jre-linux').isDirectory()) {
            throw new GradleException("./jre-linux is missing - copy a Linux x64 JRE 21 there first, see BUILD.md.")
        }
    }

    from(installerStagingDir) { into 'usr/lib/webapp-hardware-bridge' }
    from(linuxRuntimeDir) { into 'usr/lib/webapp-hardware-bridge/jre' }
    from('demo') { into 'usr/lib/webapp-hardware-bridge/demo' }
    from('packaging/linux/AppRun') { fileMode 0755 }
    from('packaging/linux/webapp-hardware-bridge.desktop')
    from('src/main/resources/icon.png') { rename { 'webapp-hardware-bridge.png' } }
    into(appDir)
}

tasks.register('buildAppImage', Exec) {
    group = 'distribution'
    description = 'Builds WebApp_Hardware_Bridge-x86_64.AppImage (needs appimagetool on PATH or ./appimagetool.AppImage)'
    dependsOn stageAppImage

    doFirst {
        if (!(appImageToolFile.getAsFile().exists() || System.getenv('PATH').split(File.pathSeparator).any { new File(it, 'appimagetool').exists() })) {
            throw new GradleException("appimagetool not found - download it to ./appimagetool.AppImage (or install on PATH), see BUILD.md.")
        }
    }

    workingDir(projectDir)
    environment 'ARCH', 'x86_64'
    environment 'VERSION', project.version
    commandLine('sh', '-c', 'command -v appimagetool >/dev/null 2>&1 && exec appimagetool "$0" || exec ./appimagetool.AppImage --appimage-extract-and-run "$0"', appDir.asFile.absolutePath)
}
