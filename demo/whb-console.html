<html>
<head>
	<link rel="stylesheet" href="whb-console.css">
	<script type="text/javascript" src="whb-console.js"></script>
	<script type="text/javascript" src="dialog06-protocol.js"></script>
</head>
<body>
	<table>
		<tr>
			<td>
				<table>
					<tr>
						<td><h3>Afficheur client</h3></td>
					</tr>
					<tr>
						<td><input id="wsAfficheurClientURL" type="text" size="30" value="ws://localhost:12212/serial/DISPLAYER"/>&nbsp;<input type="button" value="Connecter" onclick="connecterAfficheurClient()"/></td>
					</tr>
				</table>
			</td>
			<td>
				<textarea id="afficheurClient" rows="2" cols="20" class="afficheurClient"></textarea>
			</td>
		</tr>
	</table>
	<br>
	<div>
		<table>
			<tr>
				<td>
					<table>
						<tr>
							<td><h3>TakePOS</h3></td>
						</tr>
						<tr>
							<td><input id="wsTakePOSURL" type="text" size="30" value="ws://localhost:12212/takepos"/>&nbsp;<input type="button" value="Connecter" onclick="connecterTakePOS()"/></td>
						</tr>
						<tr>
							<td><textarea id="balanceResponse" rows="1" cols="44"></textarea></td>
						<tr>
							<td>
								<table>
									<tr>
										<td><label>Prix unitaire: </label></td><td><input id="unitPrice" type="text" size="7" value="20.25"/></td>
									</tr>
									<tr>
										<td><label>Tare: </label></td><td><input id="tare" type="text" size="7" value=""/></td>
									</tr>
									<tr>
										<td><label>Texte: </label></td><td><input id="text" type="text" size="13" value=""/></td>
									</tr>
								</table>
							</td>
						</tr>
						<tr>
							<td>
								<input type="button" value="Envoyer" onclick="envoyerCommandeTakePOS()"/>
								<input type="button" value="ENQ" onclick="ENQ()"/>
								<input type="button" value="NAK ?" onclick="pourquoiNAK()"/>
								<input type="button" value="Poids ?" onclick="askForWeight(document.getElementById('unitPrice').value)"/>
								<label>Poids: </label><input id="receivedWeight" type="text" size="5"/>
							</td>
						</tr>
						<tr>
							<td><label>Status: </label><textarea id="balanceStatus" rows="1" cols="30"></textarea></td>
						</tr>
					</table>
				</td>
				<td>
					<table>
						<tr>
							<td><h3>Balance</h3></td>
						</tr>
						<tr>
							<td><input id="wsBalanceURL" type="text" size="30" value="ws://localhost:12212/balance"/>&nbsp;<input type="button" value="Connecter" onclick="connecterBalance()"/></td>
						</tr>
						<tr>
							<td><textarea id="balanceRequest" rows="1" cols="44"></textarea></td>
						</tr>
						<tr>
							<td>
								<table>
									<tr>
										<td><label>Prix unitaire reçu: </label></td><td><input id="receivedUnitPrice" type="text" size="7" value=""/></td>
									</tr>
									<tr>
										<td><label>Tare reçue: </label></td><td><input id="receivedTare" type="text" size="7" value=""/></td>
									</tr>
									<tr>
										<td><label>Texte reçu: </label></td><td><input id="receivedText" type="text" size="13" value=""/></td>
									<tr>
								</table>
							</td>
						</tr>
						<tr>
							<td><label>Poids à renvoyer: </label><input id="poids" type="text" size="8" value="0.42"/><input id="weightUnit" type="text" size="2" value="kg"/></td>
						</tr>
						<tr>
							<td style="padding-top: 3px;"><label>Status: </label><input id="status" type="text" value="" size="3"/><label>Erreur à renvoyer: </label><input id="erreur" type="text" value="11" size="4"/></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</div>
	<br>
	<div>
		<table>
			<tr>
				<td><h3>WebSocket de test</h3></td>
			</tr>
			<tr>
				<td><input id="wsConsoleURL" type="text" size="30" value="ws://localhost:12212/console"/>&nbsp;<input type="button" value="Connecter" onclick="connecterConsole()"/></td>
			</tr>
			<tr>
				<td><input id="wsConsoleText" type="text" value="test"/></td>
			</tr>
			<tr>
				<td><input type="button" value="Envoyer" onclick="envoyer()"/></td>
			</tr>
		</table>
	</div>
	<br>
	<table>
		<tr>
			<td>
			<table>
				<tr>
					<td><h3>POS Printer</h3></td>
				</tr>
				<tr>
					<td><input id="wsPOSPrinterURL" type="text" size="30" value="ws://localhost:12212/posprinter"/>&nbsp;<input type="button" value="Connecter" onclick="connecterPOSPrinter()"/></td>
				</tr>
				<tr>
					<td><textarea id="wsPOSPrinterText" rows="5" cols="30">G0AbQBthAEhlbGxvIFdvcmxkCh0hERthAUVTQy9QT1MgUHJpbnRlciBUZXN0Ch0hABthAkdvb2RieWUgV29ybGQKHVZBAw==</textarea></td>
				</tr>
				<tr>
					<td><input type="button" value="Imprimer" onclick="imprimer()"/></td>
				</tr>
			</table>
		</td>
		<td>
			<div id="wsPOSPrinterOutputContent">&nbsp;</div>
		</td>
	</table>
</body>
<script type="text/javascript">
connecterAfficheurClient();
connecterTakePOS();
connecterBalance();
connecterPOSPrinter();
connecterConsole();
</script>
</html>
